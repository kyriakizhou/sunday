<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
html,body{margin:0;padding:0;background:#fff;overflow:hidden}
canvas{display:block;width:3000px;height:640px}
</style></head><body><canvas id="k" width="3000" height="640"></canvas><script>
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
 t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const lerp=(a,b,t)=>a+(b-a)*t;
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const HEAT=['#c6e2e8','#a8d0e3','#8fbbe4','#7ba9e3','#7b8ede','#7772d4','#7a62c8','#7850b8','#7542a3','#6d3690'];
function ramp(t){t=Math.max(0,Math.min(1,t));const s=t*(HEAT.length-1);
 const i=Math.min(HEAT.length-2,Math.floor(s)),f=s-i,a=hx(HEAT[i]),b=hx(HEAT[i+1]);
 return [lerp(a[0],b[0],f),lerp(a[1],b[1],f),lerp(a[2],b[2],f)]}
const rgba=(c,a)=>`rgba(${c[0]|0},${c[1]|0},${c[2]|0},${a})`;
const onset=u=>1/(1+Math.exp(-(u-0.40)*9.5));
/* B4: 64 layers, full blend, smoothed value curve, triangular dither */
const o={layers:64,jit:.09,soft:1,hblur:58,washes:10,dither:4,smoothPasses:2},seed=7714;
const c=document.getElementById('k'),x=c.getContext('2d'),W=c.width,H=c.height,r=rng(seed);
const N=o.layers;let vals=[];
for(let i=0;i<N;i++){const u=i/(N-1);vals.push(onset(u)+(r()-0.5)*o.jit)}
for(let s=0;s<o.smoothPasses;s++){const nv=vals.slice();
 for(let i=1;i<N-1;i++)nv[i]=(vals[i-1]+vals[i]*2+vals[i+1])/4;vals=nv}
vals=vals.map(v=>Math.max(0,Math.min(1,v)));
for(let i=0;i<N;i++){const y0=i*H/N,y1=(i+1)*H/N;
 const cur=ramp(vals[i]),nxt=ramp(vals[Math.min(N-1,i+1)]);
 const g=x.createLinearGradient(0,y0,0,y1);
 g.addColorStop(0,rgba(cur,1));g.addColorStop(1,rgba(nxt,1));
 x.fillStyle=g;x.fillRect(0,y0-1,W,y1-y0+2)}
x.save();x.filter=`blur(${o.hblur}px)`;
for(let i=0;i<o.washes;i++){const u=r(),y=u*H,h=H*(0.05+r()*0.14);
 x.globalAlpha=0.08+r()*0.12;const col=ramp(onset(u)+(r()-0.5)*0.18);
 const g=x.createLinearGradient(0,0,W,0);
 g.addColorStop(0,rgba(col,0));g.addColorStop(0.2+r()*0.3,rgba(col,1));
 g.addColorStop(0.65+r()*0.25,rgba(col,1));g.addColorStop(1,rgba(col,0));
 x.fillStyle=g;x.fillRect(0,y-h/2,W,h)}
x.restore();
const img=x.getImageData(0,0,W,H),d=img.data;
for(let i=0;i<d.length;i+=4){const n=((r()+r())-1)*o.dither;d[i]+=n;d[i+1]+=n;d[i+2]+=n}
x.putImageData(img,0,0);
document.title='done';
</script></body></html>
